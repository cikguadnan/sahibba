name: Validate Sahibba Static Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sahibba-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify production files
        run: |
          set -e
          test -f index.html
          test -f site.js
          test -f dashboard.css
          test -f teacher-refresh.css
          test -f teacher-refresh.js
          test -f kamus-47000.js
          test -f firebase-config.js
          test -f live.html
          test -f live.js
          test -f live.css
          test -f app/globals.css

      - name: Check JavaScript syntax
        run: |
          node --check site.js
          node --check live.js
          node --check teacher-refresh.js
          node --check firebase-config.js

      - name: Verify production references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text()
          live = Path('live.html').read_text()
          site = Path('site.js').read_text()
          required_index = ['app/globals.css', 'firebase-config.js', 'site.js']
          required_live = ['live.css', 'firebase-config.js', 'live.js']
          for ref in required_index:
              assert ref in index, f'Missing index reference: {ref}'
          for ref in required_live:
              assert ref in live, f'Missing live reference: {ref}'
          assert "./kamus-47000.js" in site, 'Dictionary import missing'
          print('Static Sahibba validation passed.')
          PY
